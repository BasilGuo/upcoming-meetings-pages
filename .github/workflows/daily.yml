name: Daily Network Meetings

on:
  schedule:
    - cron: '0 0 * * *' # 00:00 UTC every day (08:00 Asia/Shanghai)
  workflow_dispatch:

permissions:
  contents: write # commit the generated site/data.json back into the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Crawl upcoming meetings
        env:
          PYTHONPATH: src
        run: python src/main.py

      # Preserve data.json by committing it back into the repo.
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update meeting data [skip ci]"
            git pull --rebase --autostash # safety net for a manual commit race
            git push
          else
            echo "site/data.json is unchanged; nothing to push"
          fi

      # Publish ./site (index.html + data.json + app.js) to GitHub Pages.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
